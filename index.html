<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link href='https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@600;700&display=swap' rel='stylesheet'>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0b2e1a 0%, #05180c 70%, #020a05 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* ─── ORGANIC BACKGROUND BLOBS ─── */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #2e7d32, transparent 70%);
            top: -100px;
            right: -100px;
            animation: floatBlob 12s ease-in-out infinite alternate;
        }
        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #1b5e20, transparent 70%);
            bottom: -80px;
            left: -80px;
            animation: floatBlob 16s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, 40px) scale(1.2);
            }
        }

        /* ─── GLASS CARD ─── */
        #rg-popup {
            position: relative;
            z-index: 1;
            width: 85%;
            max-width: 360px;
            background: rgba(30, 70, 40, 0.25);
            backdrop-filter: blur(18px) saturate(1.3);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            border-radius: 36px;
            padding: 40px 28px 34px;
            border: 1px solid rgba(130, 200, 140, 0.30);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(180, 255, 190, 0.20),
                0 0 0 1px rgba(80, 180, 90, 0.10) inset;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.4s ease;
        }

        #rg-popup:hover {
            transform: translateY(-4px);
            box-shadow:
                0 30px 80px rgba(0, 30, 0, 0.7),
                inset 0 1px 0 rgba(180, 255, 190, 0.30),
                0 0 0 1px rgba(80, 200, 100, 0.20) inset;
        }

        /* ─── DECORATIVE ORGANIC RING ─── */
        #rg-popup::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 38px;
            padding: 2px;
            background: conic-gradient(from 0deg,
                    transparent,
                    rgba(100, 220, 130, 0.15),
                    rgba(60, 180, 80, 0.30),
                    rgba(100, 220, 130, 0.15),
                    transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: spinGlow 18s linear infinite;
            z-index: 0;
        }

        @keyframes spinGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ─── INNER GLARE ─── */
        #rg-popup::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(ellipse at 30% 20%,
                    rgba(140, 255, 160, 0.06) 0%,
                    transparent 60%);
            pointer-events: none;
            z-index: 0;
            border-radius: 40px;
        }

        /* ─── CONTENT WRAPPER ─── */
        .content-box {
            position: relative;
            z-index: 2;
        }

        /* ─── ICON ─── */
        .icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            background: radial-gradient(circle at 30% 30%, rgba(100, 220, 130, 0.25), rgba(30, 80, 40, 0.20));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(130, 220, 150, 0.25);
            box-shadow: 0 0 40px rgba(60, 200, 100, 0.15), inset 0 0 30px rgba(80, 200, 110, 0.05);
            animation: floatIcon 3s ease-in-out infinite;
            backdrop-filter: blur(4px);
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-6px) scale(1.03);
            }
        }

        .icon-wrap svg {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 0 12px rgba(80, 220, 120, 0.30));
            display: block;
        }

        /* ─── TITLE ─── */
        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c6f0d0;
            text-shadow:
                0 0 20px rgba(80, 220, 130, 0.25),
                0 0 60px rgba(40, 180, 80, 0.10);
            margin: 0 0 10px 0;
        }

        /* ─── SUBTITLE / TEXT ─── */
        p {
            color: rgba(190, 235, 200, 0.85);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.4px;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }

        p span {
            display: inline-block;
            background: rgba(60, 180, 90, 0.12);
            padding: 0 10px;
            border-radius: 20px;
            border: 1px solid rgba(130, 220, 150, 0.10);
            color: #a8e6b5;
        }

        /* ─── BUTTON ─── */
        .action-btn {
            width: 100%;
            padding: 16px 10px;
            background: linear-gradient(135deg, rgba(40, 160, 70, 0.60), rgba(20, 110, 40, 0.70));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(130, 220, 150, 0.30);
            border-radius: 60px;
            color: #e8ffe8;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow:
                0 8px 30px rgba(0, 40, 0, 0.40),
                inset 0 1px 0 rgba(200, 255, 210, 0.25),
                0 0 30px rgba(60, 200, 100, 0.10);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 58px;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%,
                    rgba(160, 255, 180, 0.10),
                    transparent 60%);
            pointer-events: none;
            animation: shimmerBtn 6s ease-in-out infinite;
        }

        @keyframes shimmerBtn {
            0%,
            100% {
                transform: translate(-10%, -10%) scale(1);
            }
            50% {
                transform: translate(10%, 10%) scale(1.1);
            }
        }

        .action-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(50, 190, 80, 0.70), rgba(30, 140, 55, 0.80));
            border-color: rgba(160, 240, 180, 0.50);
            box-shadow:
                0 12px 40px rgba(0, 60, 0, 0.50),
                inset 0 1px 0 rgba(200, 255, 210, 0.35),
                0 0 50px rgba(60, 220, 110, 0.20);
            transform: scale(1.02);
        }

        .action-btn:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(0, 30, 0, 0.40);
        }

        .action-btn:disabled {
            opacity: 0.85;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ─── LOADING SPINNER ─── */
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(200, 255, 210, 0.25);
            border-top-color: #a8f0b8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            display: inline-block;
            transition: opacity 0.2s;
        }

        .action-btn.loading .btn-text {
            opacity: 0.7;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 420px) {
            #rg-popup {
                padding: 30px 18px 28px;
                border-radius: 28px;
            }
            h2 {
                font-size: 17px;
                letter-spacing: 2px;
            }
            p {
                font-size: 14px;
            }
            .action-btn {
                font-size: 12px;
                padding: 14px 10px;
                min-height: 50px;
            }
            .icon-wrap {
                width: 60px;
                height: 60px;
            }
            .icon-wrap svg {
                width: 36px;
                height: 36px;
            }
            .spinner {
                width: 18px;
                height: 18px;
                border-width: 2.5px;
            }
        }

        @media (max-width: 360px) {
            #rg-popup {
                width: 92%;
                padding: 24px 14px 22px;
            }
            h2 {
                font-size: 15px;
            }
            p {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id='rg-popup'>
        <div class='content-box'>

            <!-- ─── ORGANIC LEAF ICON ─── -->
            <div class='icon-wrap'>
                <svg viewBox="0 0 64 64" fill="none" xmlns="file_00000000b3b0821196f715ae6098d00b.png">
                    <path d="M32 8 C16 16 8 32 12 52 C20 48 36 48 48 36 C52 28 48 16 32 8Z" fill="rgba(100,220,140,0.15)" stroke="#7fe09a" stroke-width="1.8"/>
                    <path d="M32 8 C28 20 24 32 30 44" stroke="#a8f0b8" stroke-width="2" stroke-linecap="round"/>
                    <path d="M40 24 C36 30 32 38 36 46" stroke="#a8f0b8" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="30" cy="22" r="3" fill="rgba(130,220,150,0.15)" stroke="#7fe09a" stroke-width="1.5"/>
                    <path d="M12 52 C8 44 10 34 18 28" stroke="#5ac87a" stroke-width="1.8" opacity="0.6" stroke-linecap="round"/>
                    <circle cx="36" cy="16" r="1.8" fill="#a8f0b8" opacity="0.4"/>
                    <circle cx="20" cy="30" r="1.5" fill="#a8f0b8" opacity="0.3"/>
                </svg>
            </div>

            <h2>ＹＡＡＲ ｗｉｎ 卂𝔪 Ṽ̶เק</h2>

            <p>
                <span>✨ premium ready ✨</span><br />
                Recover all your Losses Get 95% accurate Shots
            </p>
            
            <p>
                Join my exclusive Telegram group for premium tips, updates & more excitement!
            </p>

            <!-- ─── BUTTON WITH LOADING STATE ─── -->
            <button class='action-btn' id='activateBtn' onclick="handleActivate(event)">
                <span class="btn-text">🌱 &nbsp; Activate Now</span>
            </button>

        </div>
    </div>

    <script>
        // ─── HANDLE CLICK WITH LOADING ───
        function handleActivate(event) {
            const btn = document.getElementById('activateBtn');
            
            // Prevent multiple clicks
            if (btn.disabled) return;
            
            // Disable button and show loading state
            btn.disabled = true;
            btn.classList.add('loading');
            
            // Replace text with spinner + "Processing..."
            btn.innerHTML = `
                <span class="spinner"></span>
                <span class="btn-text">Processing...</span>
            `;
            
            // Simulate async operation (e.g., API call, validation)
            // then redirect to join.html
            setTimeout(function() {
                window.location.href = 'join.html';
            }, 1500); // 1.5s loading for smooth UX
        }

        // ─── (optional) bridge for other uses ───
        window.PopupBridge = {
            registerNow: function() {
                handleActivate();
            }
        };
    </script>

</body>
</html>
